
name: Reusable Platform Security Scan

on:
  workflow_call:
    inputs:
      scan_trivy:
        description: Enable all Trivy security scans
        type: boolean
        default: false

      scan_terraform:
        description: Scan Terraform IaC
        type: boolean
        default: true

      scan_application_code:
        description: Scan Java or Python application code
        type: boolean
        default: true

      app_language:
        description: Application language - auto, java, python, or both
        type: string
        default: auto

      scan_container:
        description: Build and scan the Docker image using Trivy
        type: boolean
        default: false

      dockerfile:
        description: Dockerfile path relative to repository root
        type: string
        default: Dockerfile

      build_context:
        description: Docker build context
        type: string
        default: .

      image_name:
        description: Local image name and tag
        type: string
        default: platform-app:ci

permissions:
  contents: read
  actions: read

jobs:
  security:
    name: Platform Security Checks
    runs-on: ubuntu-latest

    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create reports directory
        run: mkdir -p reports

      # ------------------------------------------------
      # 1. Detect application language and required tools
      # ------------------------------------------------
      - name: Detect application language
        id: detect
        env:
          APP_LANGUAGE: ${{ inputs.app_language }}
          SCAN_TERRAFORM: ${{ inputs.scan_terraform }}
          SCAN_APPLICATION: ${{ inputs.scan_application_code }}
          SCAN_TRIVY: ${{ inputs.scan_trivy }}
        shell: bash
        run: |
          set -euo pipefail

          language="${APP_LANGUAGE,,}"

          case "$language" in
            auto)
              java_found=false
              python_found=false

              if [[ -f pom.xml ||
                    -f build.gradle ||
                    -f build.gradle.kts ]]; then
                java_found=true
              fi

              if [[ -f requirements.txt ||
                    -f pyproject.toml ||
                    -f setup.py ||
                    -f Pipfile ]]; then
                python_found=true
              fi

              if [[ "$java_found" == true &&
                    "$python_found" == true ]]; then
                language="both"
              elif [[ "$java_found" == true ]]; then
                language="java"
              elif [[ "$python_found" == true ]]; then
                language="python"
              else
                language="unknown"
              fi
              ;;
            java|python|both)
              ;;
            *)
              echo "::error::app_language must be auto, java, python, or both."
              exit 1
              ;;
          esac

          echo "Detected application language: $language"
          echo "language=$language" >> "$GITHUB_OUTPUT"

          if [[ "$SCAN_APPLICATION" == true &&
                "$language" == unknown ]]; then
            echo "::error::Unable to detect Java or Python. Set app_language explicitly or add the appropriate project manifest."
            exit 1
          fi

          tools=""

          add_tool() {
            if [[ -n "$tools" ]]; then
              tools="${tools},$1"
            else
              tools="$1"
            fi
          }

          if [[ "$SCAN_TERRAFORM" == true ]]; then
            add_tool checkov
            add_tool terrascan
          fi

          if [[ "$SCAN_APPLICATION" == true &&
                ( "$language" == python ||
                  "$language" == both ) ]]; then
            add_tool bandit
          fi

          echo "msdo_tools=$tools" >> "$GITHUB_OUTPUT"
          echo "MSDO tools: ${tools:-none}"

      # ------------------------------------------------
      # 2. Microsoft Security DevOps
      #    Bandit only for Python; Checkov/Terrascan
      #    only when Terraform scanning is enabled.
      # ------------------------------------------------
      - name: Run MSDO
        id: msdo
        if: steps.detect.outputs.msdo_tools != ''
        uses: microsoft/security-devops-action@v1
        continue-on-error: true
        with:
          tools: ${{ steps.detect.outputs.msdo_tools }}

      - name: Copy MSDO SARIF report
        if: always()
        env:
          SARIF_SOURCE: ${{ steps.msdo.outputs.sarifFile }}
        run: |
          if [ -n "$SARIF_SOURCE" ] && [ -f "$SARIF_SOURCE" ]; then
            cp "$SARIF_SOURCE" reports/msdo-results.sarif
          else
            echo "MSDO SARIF was not generated."
          fi

      # ------------------------------------------------
      # 3. Terraform security
      # ------------------------------------------------
      - name: Install Checkov
        if: inputs.scan_terraform
        run: python3 -m pip install checkov

      - name: Scan Terraform - High and Critical
        id: checkov
        if: inputs.scan_terraform
        continue-on-error: true
        run: |
          checkov \
            --directory . \
            --framework terraform \
            --hard-fail-on HIGH,CRITICAL \
            --output json \
            > reports/checkov-results.json

      # ------------------------------------------------
      # 4. Application SAST - Java and/or Python
      # ------------------------------------------------
      - name: Install Semgrep
        if: inputs.scan_application_code
        run: python3 -m pip install semgrep

      - name: Scan Java and Python source
        id: semgrep
        if: inputs.scan_application_code
        continue-on-error: true
        run: |
          semgrep scan \
            --config p/security-audit \
            --sarif \
            --output reports/semgrep-results.sarif \
            --error \
            .

      # ------------------------------------------------
      # 5. Trivy filesystem scan
      #    Runs ONLY when scan_trivy is true.
      # ------------------------------------------------
      - name: Trivy filesystem security scan
        id: trivy_fs
        if: inputs.scan_trivy
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.31.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: json
          output: reports/trivy-filesystem-results.json
          exit-code: '1'

      # ------------------------------------------------
      # 6. Build Java application before Docker build
      # ------------------------------------------------
      - name: Set up Java
        if: >-
          inputs.scan_trivy &&
          inputs.scan_container &&
          contains(steps.detect.outputs.language, 'java')
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build Java application
        if: >-
          inputs.scan_trivy &&
          inputs.scan_container &&
          contains(steps.detect.outputs.language, 'java')
        shell: bash
        run: |
          set -euo pipefail

          if [[ -f ./mvnw ]]; then
            chmod +x ./mvnw
            ./mvnw --batch-mode clean package -DskipTests
          elif [[ -f pom.xml ]]; then
            mvn --batch-mode clean package -DskipTests
          elif [[ -f ./gradlew ]]; then
            chmod +x ./gradlew
            ./gradlew build -x test
          else
            echo "::error::Java build files found, but no Maven or Gradle build command is available."
            exit 1
          fi

      # ------------------------------------------------
      # 7. Build Docker image
      # ------------------------------------------------
      - name: Build container image
        if: inputs.scan_container && inputs.scan_trivy
        run: |
          docker build \
            --file "${{ inputs.dockerfile }}" \
            --tag "${{ inputs.image_name }}" \
            "${{ inputs.build_context }}"

      # ------------------------------------------------
      # 8. Trivy container image scan
      # ------------------------------------------------
      - name: Trivy container image scan
        id: trivy_image
        if: inputs.scan_container && inputs.scan_trivy
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.31.0
        with:
          scan-type: image
          image-ref: ${{ inputs.image_name }}
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: json
          output: reports/trivy-image-results.json
          exit-code: '1'

      # ------------------------------------------------
      # 9. Upload reports
      # ------------------------------------------------
      - name: Upload platform security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: platform-security-reports-${{ github.run_id }}
          path: reports/
          if-no-files-found: warn
          retention-days: 30

      # ------------------------------------------------
      # 10. Final security quality gate
      # ------------------------------------------------
      - name: Enforce security gates
        if: always()
        env:
          TERRAFORM_SCAN: ${{ inputs.scan_terraform }}
          APP_SCAN: ${{ inputs.scan_application_code }}
          CONTAINER_SCAN: ${{ inputs.scan_container }}
          TRIVY_ENABLED: ${{ inputs.scan_trivy }}

          DETECT_RESULT: ${{ steps.detect.outcome }}
          MSDO_TOOLS: ${{ steps.detect.outputs.msdo_tools }}
          MSDO_RESULT: ${{ steps.msdo.outcome }}

          CHECKOV_RESULT: ${{ steps.checkov.outcome }}
          SEMGREP_RESULT: ${{ steps.semgrep.outcome }}
          TRIVY_FS_RESULT: ${{ steps.trivy_fs.outcome }}
          TRIVY_IMAGE_RESULT: ${{ steps.trivy_image.outcome }}
        shell: bash
        run: |
          failed=0

          if [[ "$DETECT_RESULT" != "success" ]]; then
            echo "::error::Application detection or configuration failed."
            failed=1
          fi

          if [[ -n "$MSDO_TOOLS" &&
                "$MSDO_RESULT" != "success" ]]; then
            echo "::error::MSDO execution failed."
            failed=1
          fi

          if [[ "$TERRAFORM_SCAN" == true &&
                "$CHECKOV_RESULT" != "success" ]]; then
            echo "::error::Terraform security gate failed."
            failed=1
          fi

          if [[ "$APP_SCAN" == true &&
                "$SEMGREP_RESULT" != "success" ]]; then
            echo "::error::Application SAST gate failed."
            failed=1
          fi

          if [[ "$TRIVY_ENABLED" == true ]]; then
            if [[ "$TRIVY_FS_RESULT" != "success" ]]; then
              echo "::error::Trivy filesystem/dependency gate failed."
              failed=1
            fi

            if [[ "$CONTAINER_SCAN" == true &&
                  "$TRIVY_IMAGE_RESULT" != "success" ]]; then
              echo "::error::Trivy image security gate failed."
              failed=1
            fi
          fi

          if [[ "$failed" -ne 0 ]]; then
            exit 1
          fi

          echo "All configured security gates passed."
